name: Build and deploy DishGal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand initial source payload
        shell: bash
        run: |
          if [ -d .bootstrap ]; then
            while IFS= read -r archive; do
              target="${archive#.bootstrap/}"
              target="${target%.xz}"
              mkdir -p "$(dirname "$target")"
              echo "Expanding ${archive} -> ${target}"
              if ! xz -dc "$archive" > "$target"; then
                echo "::warning file=${archive}::XZ reported an integrity error; keeping recovered output for validation"
              fi
              if [ ! -s "$target" ]; then
                echo "::error file=${archive}::XZ recovery produced no output"
                exit 1
              fi
            done < <(find .bootstrap -type f -name '*.xz' -print | sort)

            while IFS= read -r first_part; do
              archive="${first_part%.part00.b64}"
              target="${archive#.bootstrap/}"
              target="${target%.xz}"
              packed="$(mktemp)"
              mkdir -p "$(dirname "$target")"
              echo "Reassembling ${archive}.part*.b64 -> ${target}"
              if ! cat "${archive}".part*.b64 | base64 --decode > "$packed"; then
                echo "::error file=${first_part}::Invalid base64 in ${archive}.part*.b64"
                exit 1
              fi
              if ! xz -dc "$packed" > "$target"; then
                echo "::warning file=${first_part}::XZ reported an integrity error; keeping recovered output for validation"
              fi
              rm -f "$packed"
              if [ ! -s "$target" ]; then
                echo "::error file=${first_part}::XZ recovery produced no output"
                exit 1
              fi
            done < <(find .bootstrap -type f -name '*.xz.part00.b64' -print | sort)
          fi

      - name: Preserve intact recovered DishGal sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets content scripts
          if ! git diff --cached --quiet; then
            git commit -m "Preserve recovered DishGal content and assets"
            git push
          fi

      - name: Merge and validate recipe expansion
        run: python scripts/merge_recipe_expansion.py

      - name: Verify recovered build script
        run: python -m py_compile build.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        env:
          SITE_BASE: /
          FORM_EMAIL: ${{ vars.FORM_EMAIL }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          CLOUDFLARE_TOKEN: ${{ vars.CLOUDFLARE_TOKEN }}
        run: python build.py

      - name: Inject Website Visitor Light beacon
        run: node scripts/inject-visitor-light.mjs public

      - name: Audit generated site
        run: python scripts/audit.py

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
